overrides:
  # exceljs pins uuid ^8.3.0, which carries GHSA-w5hq-g745-h8pq (missing buffer
  # bounds check in v3/v5/v6 when `buf` is supplied). exceljs only ever calls
  # v4() with no buffer, so the path is unreachable — but uuid's `{ v4 }` named
  # export is unchanged from v8 to v11, so patching costs nothing.
  uuid@<11.1.1: ^14.0.0
