# pnpm settings (pnpm 11 no longer reads the "pnpm" field in package.json).
overrides:
  # exceljs pins uuid ^8.3.0, which carries GHSA-w5hq-g745-h8pq (missing buffer
  # bounds check in v3/v5/v6 when `buf` is supplied). exceljs only ever calls
  # v4() with no buffer, so the path is unreachable — but uuid's `{ v4 }` named
  # export is unchanged from v8 to v11, so patching costs nothing.
  uuid@<11.1.1: ^11.1.1
# Deliberately NOT overridden: @hono/node-server < 2.0.5 (GHSA-frvp-7c67-39w9).
# @modelcontextprotocol/node pins ^1.19.9 and uses it only for Node <-> Web
# request conversion. The advisory is a Windows-only path traversal in
# `serveStatic`, which the SDK never imports, so the vulnerable code is
# unreachable here. Forcing the 2.x major onto the SDK's own transitive
# dependency would risk breaking the HTTP transport for no real gain. Revisit
# when the SDK widens its range.

